<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Glow filter for modern tech look -->
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded badge container -->
  <rect width="100" height="100" rx="22" fill="#FFFFFF" />
  <rect width="100" height="100" rx="22" fill="none" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- 3 Viewfinder / Focus Brackets (Cyan/Sky Blue) -->
  <!-- Top-Left Bracket -->
  <path
    d="M 37 18 H 18 V 37"
    stroke="#0080FF"
    stroke-width="5.5"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- Bottom-Left Bracket -->
  <path
    d="M 18 63 V 82 H 37"
    stroke="#0080FF"
    stroke-width="5.5"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- Bottom-Right Bracket -->
  <path
    d="M 63 82 H 82 V 63"
    stroke="#0080FF"
    stroke-width="5.5"
    stroke-linecap="square"
    stroke-linejoin="miter"
  />

  <!-- Top-Right Connector Line from Outer Ring to Target Node -->
  <line
    x1="66"
    y1="36"
    x2="77"
    y2="25"
    stroke="#082154"
    stroke-width="3.5"
    stroke-linecap="square"
  />

  <!-- Top-Right Target Node (Solid Blue Square) -->
  <rect
    x="74.5"
    y="19.5"
    width="8"
    height="8"
    fill="#0080FF"
  />

  <!-- Center Camera Iris / AI Lens -->
  <!-- Outer Navy Circle Ring -->
  <circle
    cx="50"
    cy="52"
    r="22.5"
    stroke="#082154"
    stroke-width="5.5"
    fill="none"
  />

  <!-- Inner Navy Circle (Pupil / Lens Core) -->
  <circle
    cx="50"
    cy="52"
    r="15.2"
    fill="#082154"
  />

  <!-- Pupil Light Reflection Dot (Bright Blue) -->
  <circle
    cx="44"
    cy="46.5"
    r="4.2"
    fill="#0080FF"
  />
</svg>
